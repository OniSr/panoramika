<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Panorámika — Recorridos aéreos con dron | Xalapa</title>
  <meta name="description" content="Recorridos virtuales 360° de terrenos y propiedades capturados con dron DJI Mini 3 en Xalapa, Veracruz." />
  <meta name="theme-color" content="#0d0f12" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, Telegram…).
       Es genérica: describe el producto. Para una miniatura por proyecto se
       generan páginas por proyecto (ver DEPLOY.md). -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Recorrido virtual 360° · Panorámika" />
  <meta property="og:description" content="Explora el terreno en 360° desde el aire. Captura con dron DJI Mini 3, Xalapa." />
  <meta property="og:image" content="assets/og-imagen.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- PANNELLUM desde el CDN oficial (jsDelivr). Si falla, script.js carga la
       copia local de /vendor/. Versión fijada a 2.5.7. -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.css"
    onerror="this.onerror=null; this.href='vendor/pannellum/pannellum.css';"
  />
  <link rel="stylesheet" href="style.css?v=2" />
</head>

<body>
  <!-- 1 · Lienzo 360 (Pannellum pinta aquí) -->
  <main id="panorama" role="application" aria-label="Visor de recorrido 360 grados"></main>

  <!-- 1b · Capa de video (escenas "tipo": "video"). El reproductor se inyecta
       bajo demanda desde script.js (PASO 6b); vacío no ocupa nada. -->
  <div id="video" aria-label="Video del recorrido" hidden></div>

  <!-- 2 · Barra superior -->
  <header class="barra-superior" id="barraSuperior" hidden>
    <div class="marca">
      <span class="marca__punto" aria-hidden="true"></span>
      <span class="marca__texto">Panorámika</span>
    </div>
    <div class="barra-superior__derecha">
      <p class="escena-actual" id="escenaActual" aria-live="polite"></p>
      <button class="btn-icono" id="btnCompartir" type="button" aria-label="Compartir recorrido">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- 3 · Selector de escenas -->
  <nav class="selector-escenas" id="selectorEscenas" aria-label="Escenas del recorrido" hidden></nav>

  <!-- 4 · Pantalla de bienvenida (branding + botón iniciar) -->
  <section class="intro" id="intro" hidden>
    <div class="intro__contenido">
      <div class="marca marca--intro">
        <span class="marca__punto" aria-hidden="true"></span>
        <span class="marca__texto">Panorámika</span>
      </div>
      <p class="intro__ubicacion" id="introUbicacion"></p>
      <h1 class="intro__titulo" id="introTitulo"></h1>
      <p class="intro__descripcion" id="introDescripcion"></p>
      <button class="btn-primario" id="btnIniciar" type="button">Iniciar recorrido</button>
    </div>
  </section>

  <!-- 5 · Panel de compartir -->
  <div class="hoja" id="hojaCompartir" hidden>
    <div class="hoja__fondo" id="hojaFondo"></div>
    <div class="hoja__caja" role="dialog" aria-modal="true" aria-label="Compartir recorrido">
      <h2 class="hoja__titulo">Compartir este recorrido</h2>
      <a class="hoja__opcion hoja__opcion--wa" id="compWhatsApp" href="#" target="_blank" rel="noopener">
        Enviar por WhatsApp
      </a>
      <button class="hoja__opcion" id="compCopiar" type="button">Copiar enlace</button>
      <button class="hoja__cerrar" id="compCerrar" type="button">Cerrar</button>
    </div>
  </div>

  <!-- 6 · Capa de aviso (carga / error) -->
  <div class="aviso" id="aviso" role="status" aria-live="assertive">
    <div class="aviso__caja">
      <div class="aviso__spinner" aria-hidden="true"></div>
      <p class="aviso__texto" id="avisoTexto">Preparando el recorrido…</p>
      <button class="aviso__reintentar" id="avisoReintentar" hidden>Reintentar</button>
    </div>
  </div>

  <p class="pista-arrastre" id="pistaArrastre" aria-hidden="true">Arrastra para mirar alrededor</p>

  <script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.7/build/pannellum.js"></script>
  <script src="script.js?v=2"></script>
</body>
</html>
